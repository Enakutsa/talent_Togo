server {
    # Le port est injecté au démarrage par docker-entrypoint.sh (envsubst),
    # car Render fournit son propre PORT dynamiquement au runtime.
    listen __PORT__;
    server_name _;
    root /app/public;
    index index.php index.html;

    # Taille max d'upload cohérente avec les limites PHP définies dans le Dockerfile
    client_max_body_size 30M;

    # ✅ Un cookie anormalement volumineux a été repéré sur /admin
    # (dizaines de Ko, probablement un snapshot Livewire). Ça dépassait
    # les buffers par défaut de Nginx pour les en-têtes de requête,
    # provoquant des 502 imprévisibles pile sur les pages admin.
    large_client_header_buffers 4 32k;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 4 32k;

    # ✅ /livewire/* n'est PAS un vrai fichier statique, même les .js —
    # c'est une route PHP dynamique (le coeur JS de Livewire, essentiel
    # à la soumission de TOUS les formulaires Filament, y compris /admin/
    # login). La règle de fichiers statiques plus bas l'interceptait et
    # renvoyait un 404 au lieu de laisser PHP la générer -> les
    # formulaires "semblaient" fonctionner mais ne se soumettaient
    # jamais réellement (champs vidés, aucune action).
    location ^~ /livewire/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Fichiers statiques (build Vite, storage lié) : cache long + pas de log
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.ht {
        deny all;
    }
}