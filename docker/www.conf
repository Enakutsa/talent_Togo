[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data

; ✅ Par défaut, PHP-FPM limite à 5 processus enfants max — trop bas pour
; Filament qui envoie plusieurs requêtes en parallèle (Livewire, assets
; dynamiques). Au-delà de 5 requêtes simultanées, les suivantes
; attendent en file, et Nginx finit par abandonner -> 502 Bad Gateway.
;
; ✅ Mode "ondemand" au lieu de "dynamic" : les processus PHP-FPM ne
; sont créés QUE quand une requête arrive, et fermés après 10s
; d'inactivité (pm.process_idle_timeout). Contrairement à "dynamic" qui
; garde toujours 2-3 processus "en réserve" (donc de la RAM occupée en
; permanence même sans trafic), "ondemand" consomme quasi 0 Mo au repos.
; Sur les 512 Mo du plan gratuit Render, partagés avec Nginx et le
; queue-worker, c'est ce qui évite le plus les crashs par manque de RAM.
; ✅ URGENCE : mode "static" (nombre fixe de processus TOUJOURS actifs)
; au lieu de "ondemand". Avec "ondemand", les processus s'éteignaient
; après 60s d'inactivité, et le redémarrage à froid (recréer le
; process + recharger tout Laravel) pouvait dépasser le temps
; raisonnable avec seulement 0.15 CPU dispo -> 502 imprévisible.
; "static" élimine ce risque : 4 processus toujours prêts, zéro délai
; de démarrage, comportement stable et prévisible.
pm = static
pm.max_children = 4
pm.max_requests = 500