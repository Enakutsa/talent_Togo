[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data

; ✅ Par défaut, PHP-FPM limite à 5 processus enfants max — trop bas pour
; Filament qui envoie plusieurs requêtes en parallèle (Livewire, assets
; dynamiques). Au-delà de 5 requêtes simultanées, les suivantes
; attendent en file, et Nginx finit par abandonner -> 502 Bad Gateway.
;
; Valeurs calibrées pour le plan gratuit Render (~512 Mo RAM) : chaque
; process PHP-FPM avec Laravel consomme grosso modo 25-40 Mo, donc on
; reste prudent pour éviter un Out Of Memory qui tuerait le conteneur.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500