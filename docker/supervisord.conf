[program:nginx]
; ✅ "worker_processes 1" forcé : Nginx détecte parfois plusieurs coeurs
; CPU dans le conteneur (peut voir le nombre de coeurs de la machine
; hôte de Render, pas le vrai quota alloué de 0.15 CPU), et lance un
; worker par coeur détecté par défaut. Ça ajoute des process Nginx
; inutiles qui rivalisent avec PHP-FPM pour la même toute petite
; tranche de CPU réellement disponible.
command=nginx -g "worker_processes 1; daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20