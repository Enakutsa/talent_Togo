services:
  app:
    build:
      context: .
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: 8000
      # ⚠️ Surcharge du .env : ton .env a DB_HOST=127.0.0.1, ce qui à
      # l'intérieur du conteneur pointerait vers le conteneur lui-même
      # (pas vers Windows). host.docker.internal est l'adresse spéciale
      # fournie par Docker Desktop pour atteindre ta machine Windows,
      # donc ton vrai PostgreSQL, depuis l'intérieur du conteneur.
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage